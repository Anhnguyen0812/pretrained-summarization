model:
  name_or_path: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  use_fast_tokenizer: true
  trust_remote_code: false
  cache_dir:
  padding_side: right
  torch_dtype: float16
  max_parameters: 3000000000

data:
  train_file: ../train-00000-of-00001.parquet
  valid_file: ../valid-00000-of-00001.parquet
  max_source_length: 768
  max_target_length: 128
  max_length: 896
  preprocessing_num_proc: 1
  max_train_samples: 2500
  max_eval_samples: 120
  prompt_template: "Bạn là trợ lý tóm tắt tiếng Việt. Viết duy nhất một đoạn tóm tắt cuối cùng, không viết suy luận, không giải thích, không dùng thẻ <think>. Giữ tên riêng, số liệu, mốc thời gian quan trọng. Không thêm thông tin ngoài văn bản.\n\nVăn bản:\n{article}\n\nTóm tắt:\n"

training:
  output_dir: outputs/deepseek_r1_distill_qwen_1_5b_lora
  overwrite_output_dir: false
  seed: 42
  precision: fp16
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  num_train_epochs: 2
  max_steps: 300
  learning_rate: 0.0001
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  optim: adamw_torch
  gradient_checkpointing: true
  strategy: steps
  save_strategy: steps
  eval_steps: 300
  save_steps: 300
  logging_steps: 25
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  greater_is_better: false
  report_to:
    - tensorboard
  save_safetensors: true

generation:
  max_new_tokens: 128
  num_beams: 1
  do_sample: false
  no_repeat_ngram_size: 3
  repetition_penalty: 1.08

lora:
  enabled: true
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
